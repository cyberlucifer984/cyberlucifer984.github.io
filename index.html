<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praveen J – Portfolio</title>
<meta name="description" content="Portfolio of Praveen J: selected projects, skills and contact details.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000; --surface:rgba(16,20,30,.82); --ink:#EEF1F7; --muted:#AEB8CC; --line:rgba(255,255,255,.18);
  --accent:#8FA2FF; --accent-ink:#0B1020;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Newsreader",Georgia,serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.65)),url("background.jpg") center/cover no-repeat #000}
body{background:var(--bg);color:var(--ink);font:1.125rem/1.65 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 1.5rem}
header.top{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 0;font-family:var(--display);font-weight:500}
header.top nav{display:flex;gap:1.5rem;align-items:center}
header.top a{text-decoration:none}
header.top a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
.theme{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:.3rem .9rem;font-family:var(--display);font-size:.9rem}

/* Hero: the one memorable element */
.hero{padding:4rem 0 3rem}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(3rem,11vw,8rem);line-height:.92;letter-spacing:-.04em}
.hero h1 span{display:block;width:fit-content}
.hero p{max-width:40rem;margin-top:1.75rem;font-size:1.2rem;color:var(--muted)}
.status{margin-top:1.5rem;font-family:var(--display);font-size:.95rem;display:flex;gap:.6rem;align-items:center}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:#1fa971}

section{padding:3rem 0;border-top:1px solid var(--line)}
h2{font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:-.02em;margin-bottom:1.5rem}

/* Photo frame */
.hero-grid{display:grid;grid-template-columns:1fr 25%;gap:3.5rem;align-items:center}
.portrait{position:relative;width:100%;aspect-ratio:3/4;margin:0}
.portrait::before{content:"";position:absolute;inset:0;transform:translate(16px,16px);border:2px solid var(--accent);border-radius:6px}
.portrait .frame{position:absolute;inset:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface);display:grid;place-items:center;text-align:center;color:var(--muted);font-family:var(--display);padding:1rem}
.portrait .frame b{display:block;font-size:3.5rem;font-weight:800;color:var(--ink);letter-spacing:-.03em}
.portrait .frame span{font-size:.9rem}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
@media(max-width:820px){
  .hero-grid{grid-template-columns:1fr;gap:2.5rem}
  .portrait{max-width:260px;margin-right:16px}
}

/* Social links + shade-off effect */
.social{display:flex;flex-wrap:wrap;gap:.5rem 2.25rem;margin-top:2.25rem}
.social a,footer a{font-family:var(--display);font-weight:500;text-decoration:none;position:relative;transition:opacity .6s ease,filter .6s ease,letter-spacing .6s ease,color .2s}
.social a{font-size:1.7rem}
.social a::after,footer a::after{content:"";position:absolute;left:0;bottom:-.15em;height:2px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.social a:hover,footer a:hover{color:var(--accent)}
.social a:hover::after,footer a:hover::after{transform:scaleX(1)}
.social a.fading,footer a.fading{opacity:0;filter:blur(8px);letter-spacing:.16em}
.shade{position:fixed;inset:0;z-index:100;background:#000;opacity:0;pointer-events:none;transition:opacity .65s ease}
body.leaving .shade{opacity:1;pointer-events:auto}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem}
footer .links{display:flex;gap:1.5rem}
.hero h1,.hero p{text-shadow:0 2px 24px rgba(0,0,0,.6)}

/* Controls */
.controls{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1.5rem}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:.35rem 1rem;border-radius:999px;font-family:var(--display);font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.search{margin-left:auto;padding:.45rem .9rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:1rem;min-width:12rem}

/* Project list */
#projects{list-style:none;padding:0}
.project{display:grid;grid-template-columns:5rem 1fr auto;gap:1rem;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:1.25rem 0;color:inherit}
.project:hover h3{color:var(--accent)}
.project .year{font-family:var(--display);color:var(--muted)}
.project h3{font-family:var(--display);font-size:1.6rem;font-weight:500;letter-spacing:-.01em}
.project p{color:var(--muted);font-size:1.05rem}
.project .tag{font-family:var(--display);font-size:.9rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:.1rem .6rem}
.empty{color:var(--muted);padding:1rem 0}

/* Skills */
.skills{display:flex;flex-wrap:wrap;gap:.6rem;list-style:none;padding:0}
.skills li{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.3rem .9rem;font-family:var(--display);font-size:.95rem}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:36rem;width:calc(100% - 2rem);padding:2rem}
dialog::backdrop{background:rgba(10,16,30,.55)}
dialog h3{font-family:var(--display);font-size:1.8rem;margin-bottom:.5rem}
dialog .links{display:flex;gap:1rem;margin:1.25rem 0 1.5rem;font-family:var(--display)}
dialog .links a{color:var(--accent)}

/* Contact */
form{display:grid;gap:1rem;max-width:34rem}
label{font-family:var(--display);font-size:.95rem;display:grid;gap:.3rem}
input,textarea{padding:.7rem .9rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.cta{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:.75rem 1.4rem;font-family:var(--display);font-weight:500;width:fit-content}
.note{color:var(--muted);font-size:.95rem;min-height:1.4em}
footer{padding:2rem 0 3rem;color:var(--muted);font-size:.95rem;border-top:1px solid var(--line)}

@media(max-width:640px){
  .project{grid-template-columns:1fr}
  .project .tag{width:fit-content}
  .search{margin-left:0;width:100%}
  header.top nav a{display:none}
}
@media(prefers-reduced-motion:no-preference){
  .hero h1 span{animation:in .8s cubic-bezier(.2,.7,.2,1) both}
  .hero h1 span:nth-child(2){animation-delay:.12s}
  @keyframes in{from{opacity:0;transform:translateY(18px)}}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="#top">Portfolio</a>
    <nav>
      <a href="#work">Work</a><a href="#skills">Skills</a><a href="#contact">Contact</a>
      
    </nav>
  </header>

  <main id="top">
    <div class="hero">
    <div class="hero-grid">
    <div class="hero-text">
      <h1><span>Praveen</span><span>J</span></h1>
      <p id="tagline"></p>
      <nav class="social" aria-label="My profiles">
        <a href="https://github.com/cyberlucifer984" data-social>GitHub</a>
        <a href="https://www.instagram.com/praveen_.sub/" data-social>Instagram</a>
        <a href="https://www.linkedin.com/in/praveen-j-870844297/" data-social>LinkedIn</a>
      </nav>
      <div class="status"><i class="dot" aria-hidden="true"></i><span id="status"></span></div>
    </div>
    <figure class="portrait">
      <div class="frame"><div><b>PJ</b><span>Save your photo as photo.jpg<br>in this folder</span></div></div>
      <img src="photo.jpg" alt="Portrait of Praveen J" onerror="this.remove()">
    </figure>
    </div>
    </div>

    <section id="work">
      <h2>Selected work</h2>
      <div class="controls">
        <div id="filters" role="group" aria-label="Filter projects"></div>
        <input class="search" id="search" type="search" placeholder="Search projects" aria-label="Search projects">
      </div>
      <ul id="projects"></ul>
    </section>

    <section id="skills">
      <h2>Skills</h2>
      <ul class="skills" id="skillList"></ul>
    </section>

    <section id="contact">
      <h2>Get in touch</h2>
      <form id="contactForm">
        <label>Name<input name="name" required autocomplete="name"></label>
        <label>Email<input name="email" type="email" required autocomplete="email"></label>
        <label>Message<textarea name="message" rows="5" required></textarea></label>
        <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" style="display:none">
        <button class="cta" type="submit">Send message</button>
        <p class="note" id="formNote" role="status"></p>
      </form>
    </section>
  </main>
  <footer>
    <span>© <span id="year"></span> Praveen J</span>
    <span class="links">
      <a href="https://github.com/cyberlucifer984" data-social>GitHub</a>
      <a href="https://www.instagram.com/praveen_.sub/" data-social>Instagram</a>
      <a href="https://www.linkedin.com/in/praveen-j-870844297/" data-social>LinkedIn</a>
    </span>
  </footer>
</div>

<div class="shade" id="shade" aria-hidden="true"></div>

<dialog id="dlg">
  <h3 id="dTitle"></h3>
  <p id="dMeta" class="note"></p>
  <p id="dDesc"></p>
  <div class="links" id="dLinks"></div>
  <button class="cta" id="dClose">Close</button>
</dialog>

<script>
/* ============ EDIT THIS SECTION ONLY ============ */
const PROFILE = {
  email: "praveenjanakiramanprabha@gmail.com",            // shown only if sending fails
  web3formsKey: "fbdc88f4-c44a-4dfb-93ba-478bfaa7a349", // free key from web3forms.com (see steps)
  tagline: "Hi, I'm Praveen J, an undergraduate student pursuing my bachelor's degree and an aspiring web developer. As a fresher, I'm eager to turn what I've learned in the classroom into real projects, and I enjoy solving problems with clean, simple code. I'm a quick learner who values teamwork, curiosity, and steady growth, and I'm looking for opportunities to contribute and improve. I design and build useful things for the web. Find me on the profiles below.",
  status: "Open to new projects",
  skills: ["HTML & CSS","JavaScript","React","Node.js","Python","SQL","Figma","Git"]
};
const PROJECTS = [
  { title:"Weather Dashboard", year:2026, category:"Web App", tags:["JavaScript","API"],
    desc:"Live forecast dashboard with city search and 5-day charts.", live:"#", code:"#" },
  { title:"Task Tracker", year:2025, category:"Web App", tags:["React","Node.js"],
    desc:"A to-do app with login, labels and a shared team view.", live:"#", code:"#" },
  { title:"Café Brand Site", year:2025, category:"Design", tags:["Figma","CSS"],
    desc:"Brand identity and a responsive website for a local café.", live:"#", code:"" },
  { title:"Sales Data Analysis", year:2024, category:"Data", tags:["Python","SQL"],
    desc:"Cleaned and analysed two years of sales data and found the top growth regions.", live:"", code:"#" }
];
/* ================================================== */

const $ = s => document.querySelector(s);
const root = document.documentElement;
let activeCat = "All", query = "";


/* Static fields */
$("#tagline").textContent = PROFILE.tagline;
$("#status").textContent = PROFILE.status;
$("#year").textContent = new Date().getFullYear();
$("#skillList").innerHTML = PROFILE.skills.map(s => `<li>${esc(s)}</li>`).join("");

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* Filters + search build themselves from the PROJECTS data */
function renderFilters(){
  const cats = ["All", ...new Set(PROJECTS.map(p => p.category))];
  $("#filters").innerHTML = cats.map(c =>
    `<button class="chip" aria-pressed="${c===activeCat}" data-cat="${esc(c)}">${esc(c)}</button>`).join(" ");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { activeCat = b.dataset.cat; renderFilters(); renderProjects(); });
}
function renderProjects(){
  const q = query.toLowerCase();
  const list = PROJECTS.map((p,i) => ({...p,i}))
    .filter(p => activeCat === "All" || p.category === activeCat)
    .filter(p => !q || [p.title,p.desc,...p.tags].join(" ").toLowerCase().includes(q))
    .sort((a,b) => b.year - a.year);
  $("#projects").innerHTML = list.length ? list.map(p => `
    <li><button class="project" data-i="${p.i}">
      <span class="year">${p.year}</span>
      <span><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p></span>
      <span class="tag">${esc(p.category)}</span>
    </button></li>`).join("") : `<li class="empty">No projects match. Try another filter or search.</li>`;
  document.querySelectorAll(".project").forEach(b => b.onclick = () => openProject(PROJECTS[b.dataset.i]));
}
$("#search").oninput = e => { query = e.target.value; renderProjects(); };

/* Project details dialog */
const dlg = $("#dlg");
function openProject(p){
  $("#dTitle").textContent = p.title;
  $("#dMeta").textContent = `${p.category} · ${p.year} · ${p.tags.join(", ")}`;
  $("#dDesc").textContent = p.desc;
  $("#dLinks").innerHTML =
    (p.live ? `<a href="${esc(p.live)}" target="_blank" rel="noopener">View live</a>` : "") +
    (p.code ? `<a href="${esc(p.code)}" target="_blank" rel="noopener">View code</a>` : "");
  dlg.showModal();
}
$("#dClose").onclick = () => dlg.close();
dlg.addEventListener("click", e => { if(e.target === dlg) dlg.close(); });

/* Contact form: sends the message in the background through Web3Forms, so the visitor never leaves the page */
$("#contactForm").addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target, note = $("#formNote"), btn = form.querySelector("button[type=submit]");
  if (!PROFILE.web3formsKey || PROFILE.web3formsKey.startsWith("PASTE")) {
    note.textContent = "The form isn't connected yet. Add your Web3Forms access key in the edit section.";
    return;
  }
  const f = new FormData(form);
  if (f.get("botcheck")) return; // spam bots tick the hidden box
  btn.disabled = true; btn.textContent = "Sending…"; note.textContent = "";
  try {
    const res = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({
        access_key: PROFILE.web3formsKey,
        subject: "New portfolio message from " + f.get("name"),
        from_name: "Portfolio website",
        name: f.get("name"), email: f.get("email"), message: f.get("message")
      })
    });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.message || "Request failed");
    form.reset();
    note.textContent = "Message sent. Thanks, I'll reply soon.";
  } catch (err) {
    note.textContent = "Your message didn't send. Check your connection and try again, or email " + PROFILE.email + ".";
  } finally {
    btn.disabled = false; btn.textContent = "Send message";
  }
});

/* Social links: the word fades out, the page shades to black, then you go to the profile */
document.querySelectorAll("a[data-social]").forEach(a => {
  a.addEventListener("click", e => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return; // let new-tab clicks work normally
    e.preventDefault();
    a.classList.add("fading");
    document.body.classList.add("leaving");
    const wait = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 650;
    setTimeout(() => { location.href = a.href; }, wait);
  });
});
/* Coming back with the browser's Back button: clear the shade */
addEventListener("pageshow", () => {
  document.body.classList.remove("leaving");
  document.querySelectorAll(".fading").forEach(el => el.classList.remove("fading"));
});

renderFilters();
renderProjects();
</script>
</body>
</html>
